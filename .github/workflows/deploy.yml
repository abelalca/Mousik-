# Deployment pipeline
#   push to main        → DEV  (web)
#   tag vX.Y.Z-rc.N     → QA   (database migrations + web)
#   tag vX.Y.Z          → PROD (approval required → backup → migrations → web)
#
# Each job uses a GitHub Environment (dev / qa / production) holding its own
# variables and secrets (see docs/DEVOPS.md). Jobs skip cleanly until configured.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency: deploy-dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-web
        with:
          env-name: dev
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY }}
          auth-providers: ${{ vars.AUTH_PROVIDERS }}
      - name: Deploy web to Cloudflare Pages (dev)
        if: vars.CLOUDFLARE_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=dev

  qa:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    environment: qa
    concurrency: deploy-qa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-web
        with:
          env-name: qa
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY }}
          auth-providers: ${{ vars.AUTH_PROVIDERS }}
      - name: Apply database migrations (qa)
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          npx supabase db push
      - name: Deploy web to Cloudflare Pages (qa)
        if: vars.CLOUDFLARE_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=qa

  production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    # The "production" environment requires a reviewer's approval before this job starts.
    environment: production
    concurrency: deploy-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-web
        with:
          env-name: prod
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY }}
          auth-providers: ${{ vars.AUTH_PROVIDERS }}
      - name: Encrypted backup before migrating
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is required"; exit 1; }
          npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          npx supabase db dump -f schema.sql
          npx supabase db dump --data-only -f data.sql
          tar czf - schema.sql data.sql | gpg --batch --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o predeploy-backup.tgz.gpg
          rm -f schema.sql data.sql
      - name: Upload backup
        if: vars.SUPABASE_PROJECT_REF != ''
        uses: actions/upload-artifact@v7
        with:
          name: predeploy-backup-${{ github.ref_name }}
          path: predeploy-backup.tgz.gpg
          retention-days: 30
      - name: Apply database migrations (production)
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push
      - name: Deploy web to Cloudflare Pages (production)
        if: vars.CLOUDFLARE_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
